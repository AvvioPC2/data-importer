<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvvioPC 2 - Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        :root {
            --primary-bg: #f4f7f6; --header-bg: #003366; --header-text: #ffffff;
            --accent-color: #007bff; --success-color: #28a745; --reprint-color: #6c757d;
            --border-color: #ced4da; --text-main: #333333; --text-muted: #6c757d;
            --disabled-bg: #e9ecef; --border-radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--primary-bg); color: var(--text-main); padding-bottom: 40px; }

        ::placeholder { color: #a0a0a0; opacity: 1; }
        #ms-password::placeholder { color: #555555; font-weight: bold; font-family: monospace; letter-spacing: 1px; }

        .app-header { background-color: var(--header-bg); color: var(--header-text); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
        .app-title { flex: 1; text-align: center; font-family: 'Barlow', sans-serif; font-size: 38px; color: #ffffff; }
        .form-container { max-width: 600px; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .form-group { background: #fff; padding: 15px; border-radius: var(--border-radius); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .section-title { font-size: 18px; font-weight: bold; border-bottom: 2px solid var(--primary-bg); padding-bottom: 8px; margin-bottom: 15px; color: var(--header-bg); }
        
        .input-with-icon { display: flex; align-items: stretch; border: 1px solid var(--border-color); border-radius: var(--border-radius); overflow: hidden; background: #fff; }
        .input-with-icon input { flex-grow: 1; border: none; padding: 12px 15px; font-size: 17px; outline: none; font-family: monospace; }
        
        .camera-btn { background: var(--primary-bg); border: none; border-left: 1px solid var(--border-color); padding: 0 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .camera-btn svg:not(.colored-svg) { width: 26px; height: 26px; fill: var(--header-bg); }

        .checkbox-group { display: flex; align-items: center; justify-content: flex-start; gap: 10px; cursor: pointer; padding: 5px 0; }
        .checkbox-group input[type="checkbox"] { flex-shrink: 0; width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group span { font-size: 17px; line-height: 1.3; }

        .submit-container { padding: 30px 0; display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; }
        #submit-btn { width: 100%; max-width: 400px; padding: 18px; font-size: 20px; font-weight: bold; border: none; border-radius: 50px; color: white; background: var(--success-color); cursor: pointer; }
        #submit-btn.is-disabled { background: var(--text-muted); cursor: not-allowed; }
        
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: rgba(0, 0, 0, 0.9); color: #fff; padding: 15px 30px; border-radius: 50px; font-size: 15px; font-weight: 500; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #toast-container.show { opacity: 1; }
        
        .conditional-field { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease-out; }
        .conditional-field.visible { max-height: 110px; opacity: 1; margin-top: 10px; }
        .segmented-control { display: flex; gap: 5px; background: var(--disabled-bg); padding: 4px; border-radius: var(--border-radius); margin-bottom: 10px; }
        .segmented-control label { flex: 1; text-align: center; padding: 12px 5px; font-size: 16px; font-weight: 500; color: var(--text-muted); cursor: pointer; }
        .segmented-control input[type="radio"] { display: none; }
        .segmented-control input[type="radio"]:checked + label { background: #fff; color: var(--accent-color); font-weight: 600; border-radius: 4px; }
        .email-group { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--border-radius); background: #fff; padding-right: 8px; }
        .email-group input { flex: 1; border: none; padding: 12px 10px; font-size: 17px; outline: none; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">AvvioPC 2</div>
    </header>

    <main class="form-container">
        <div class="form-group">
            <div class="section-title">Serial number del prodotto *</div>
            <div class="input-with-icon">
                <input type="text" id="pc-serial" style="text-transform: none;" oninput="validateForm()">
                <button type="button" class="camera-btn" onclick="openScanner('pc-serial', 'barcode')">
                    <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <div class="section-title">Account locale *</div>
            <input type="text" id="local-account" class="standard-input" style="text-transform: none;" oninput="validateForm()">
        </div>

        <div class="form-group">
            <div class="section-title">Suite da ufficio</div>
            <div class="segmented-control">
                <input type="radio" id="office-ms" name="office_type" value="ms_office" onchange="toggleFields(); validateForm();">
                <label for="office-ms">Office 365</label>
                <input type="radio" id="office-libre" name="office_type" value="libre_office" onchange="toggleFields(); validateForm();" checked>
                <label for="office-libre">Libre Office</label>
            </div>
        </div>

        <div class="form-group">
            <div class="section-title">Protezione antivirus</div>
            <div class="segmented-control">
                <input type="radio" id="av-norton" name="av_type" value="norton" onchange="toggleFields(); validateForm();">
                <label for="av-norton">Norton<br>360 Deluxe</label>
                <input type="radio" id="av-mcafee" name="av_type" value="mcafee" onchange="toggleFields(); validateForm();">
                <label for="av-mcafee">McAfee<br>Total Protection</label>
                <input type="radio" id="av-none" name="av_type" value="none" onchange="toggleFields(); validateForm();" checked>
                <label for="av-none">Windows<br>Defender</label>
            </div>
        </div>

        <div class="form-group">
            <div class="section-title">Unieuro Cyber Protection</div>
            <label class="checkbox-group">
                <input type="checkbox" id="run-cyber">
                <span>Installa icona di attivazione<br>del servizio</span>
            </label>
        </div>

        <div class="form-group">
            <div class="section-title">Account Microsoft *</div>
            <button type="button" id="btn-create-ms" style="width: 100%; padding: 14px; border: none; border-radius: 50px; background: #007bff; color: white; font-weight: bold; cursor: pointer; margin-bottom: 15px;">Crea nuovo account Microsoft</button>
            <label class="form-label">Nome utente</label>
            <div class="email-group">
                <input type="text" id="ms-username" autocapitalize="none" oninput="validateForm()">
                <span>@</span>
                <select id="ms-domain"><option value="outlook.it">outlook.it</option><option value="outlook.com">outlook.com</option></select>
            </div>
            <label class="form-label">Password</label>
            <div class="input-with-icon">
                <input type="text" id="ms-password" style="text-transform: none;" oninput="validateForm()">
                <button type="button" class="camera-btn" onclick="generateRandomPassword()">
                    <svg class="colored-svg" viewBox="0 0 64 64" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 16 10 C 26 2, 38 2, 48 10" fill="none" stroke="#28a745" stroke-width="4" stroke-linecap="round" />
                        <polygon points="45,5 52,12 43,15" fill="#28a745" />
                        <path d="M 10 48 C 2 38, 2 26, 10 16" fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" />
                        <polygon points="15,22 8,15 5,24" fill="#ffc107" />
                        <g transform="translate(32, 36)">
                            <polygon points="0,-16 16,-8 0,0 -16,-8" fill="#ff5e5e" />
                            <polygon points="-16,-8 0,0 0,16 -16,8" fill="#ffbd55" />
                            <polygon points="0,0 16,-8 16,8 0,16" fill="#007bff" />
                            <circle cx="0" cy="-8" r="2.5" fill="#fff" /><circle cx="-8" cy="0" r="2" fill="#fff" />
                            <circle cx="-8" cy="8" r="2" fill="#fff" /><circle cx="8" cy="-2" r="2" fill="#fff" />
                            <circle cx="8" cy="4" r="2" fill="#fff" /><circle cx="8" cy="10" r="2" fill="#fff" />
                        </g>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <div class="section-title">Aggiornamenti di sistema</div>
            <label class="checkbox-group">
                <input type="checkbox" id="run-updates">
                <span>Eseguire Windows Update<br>a fine installazione</span>
            </label>
        </div>

        <div class="submit-container">
            <button id="submit-btn" class="is-disabled">Caricamento dati</button>
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        const elements = {
            msPassword: document.getElementById('ms-password'),
            btnCreateMs: document.getElementById('btn-create-ms'),
            toastContainer: document.getElementById('toast-container'),
            runCyber: document.getElementById('run-cyber'),
            runUpdates: document.getElementById('run-updates'),
            submitBtn: document.getElementById('submit-btn'),
            pcSerial: document.getElementById('pc-serial')
        };

        function generateRandomPassword() {
            const uppers = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", lowers = "abcdefghijklmnopqrstuvwxyz", numbers = "0123456789", symbols = "!@#$%^&*";
            const allChars = uppers + lowers + numbers + symbols;
            let pwd = uppers[Math.floor(Math.random() * uppers.length)] + lowers[Math.floor(Math.random() * lowers.length)] + numbers[Math.floor(Math.random() * numbers.length)] + symbols[Math.floor(Math.random() * symbols.length)];
            for(let i = 0; i < 8; i++) pwd += allChars[Math.floor(Math.random() * allChars.length)];
            pwd = pwd.split('').sort(() => 0.5 - Math.random()).join('');
            elements.msPassword.placeholder = pwd;
            elements.msPassword.value = "";
        }

        function showToast(msg) {
            elements.toastContainer.innerHTML = msg;
            elements.toastContainer.classList.add('show');
            setTimeout(() => { elements.toastContainer.classList.remove('show'); }, 3000);
        }

        elements.btnCreateMs.onclick = () => {
            const isCustom = elements.msPassword.value.trim() !== "";
            const pwdToCopy = isCustom ? elements.msPassword.value.trim() : elements.msPassword.placeholder;
            const msg = isCustom ? "Password personalizzata<br>copiata negli appunti" : "Password casuale<br>copiata negli appunti";

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(pwdToCopy).then(() => showToast(msg));
            } else {
                const el = document.createElement('textarea');
                el.value = pwdToCopy; document.body.appendChild(el); el.select();
                document.execCommand('copy'); document.body.removeChild(el);
                showToast(msg);
            }
            window.open('https://signup.live.com/', '_blank');
        };

        function validateForm() {
            let pwdValid = elements.msPassword.value.trim() !== "" || elements.msPassword.placeholder.length >= 8;
            let ok = elements.pcSerial.value.trim() !== "" && pwdValid;
            if (ok) elements.submitBtn.classList.remove('is-disabled');
            else elements.submitBtn.classList.add('is-disabled');
        }

        window.onload = generateRandomPassword;
    </script>
</body>
</html>
